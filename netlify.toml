# Static site publish (repo root). _redirects handles pretty URLs on Netlify.
# On Netlify only: rewrite canonicals/sitemap to this deploy so AI tools
# that follow <link rel="canonical"> analyze staging instead of production.
[build]
  publish = "."
  command = "node scripts/netlify-prepare-staging.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    # Allow embed/iframe-based review tools (DENY blocked many AI checkers)
    X-Content-Type-Options = "nosniff"
    # Do not send X-Robots-Tag: noindex — tools must be allowed to fetch

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
