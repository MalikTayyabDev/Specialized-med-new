# Netlify: MCT landing staging containment + static asset caching.
# Stage 0.1: also enable Site settings → Access control (password) on staging deploys.
# Stage 0.2: X-Robots-Tag until production launch gate passes.
# Managed by: npm run mct:index / npm run mct:noindex
#
# Production canonical (PDF Stage 3.1): /mobile-cardiac-telemetry-mct/
# Netlify Pretty URLs may strip the trailing slash on staging; production Apache (.htaccess) keeps it.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/mobile-cardiac-telemetry-mct"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/mobile-cardiac-telemetry-mct/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/mobile-cardiac-telemetry-mct.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Long-cache hashed-looking static assets (fingerprints not required; filenames are stable)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
